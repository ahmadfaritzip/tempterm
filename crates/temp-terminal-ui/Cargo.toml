[package]
name = "temp-terminal-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
temp-terminal-proto = { workspace = true }
temp-terminal-term = { workspace = true }
temp-terminal-procs = { workspace = true }
temp-terminal-core = { workspace = true }
temp-terminal-daemon = { workspace = true }
temp-terminal-rig = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
eframe = { version = "0.30.0", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.30.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[[bin]]
name = "temp-terminal-gui"
path = "src/main.rs"

